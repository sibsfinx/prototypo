enableImmutableInstalls: false

httpTimeout: 60000

networkConcurrency: 8

nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-3.8.7.cjs

# Compatibility mode: enable Yarn 1 lockfile reading
# This allows Yarn 3 to work with existing Yarn 1 lockfiles
supportedArchitectures:
  os:
    - current
  cpu:
    - current
