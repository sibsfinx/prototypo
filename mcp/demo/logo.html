<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Školjka Logo — 54</title>
	<style>
		@font-face {
			font-family: "Skoljka Logo UltraBold";
			src: url("./fonts/SkoljkaLogo-UltraBold.otf") format("opentype");
			font-weight: 900;
			font-display: block;
		}
		@font-face {
			font-family: "Skoljka Logo Humanist";
			src: url("./fonts/SkoljkaLogo-Humanist.otf") format("opentype");
			font-weight: 800;
			font-display: block;
		}
		@font-face {
			font-family: "Skoljka Logo UltraContrast";
			src: url("./fonts/SkoljkaLogo-UltraContrast.otf") format("opentype");
			font-weight: 800;
			font-display: block;
		}
		@font-face {
			font-family: "Skoljka Logo FellContrast";
			src: url("./fonts/SkoljkaLogo-FellContrast.otf") format("opentype");
			font-weight: 800;
			font-display: block;
		}
		@font-face {
			font-family: "Skoljka Logo Elegant";
			src: url("./fonts/SkoljkaLogo-Elegant.otf") format("opentype");
			font-weight: 400;
			font-display: block;
		}

		:root {
			--navy: #0a1628;
			--navy-deep: #060e1a;
			--gold: #c9a227;
			--gold-soft: #d4b45a;
		}

		* { box-sizing: border-box; margin: 0; }
		html, body { background: var(--navy-deep); color: var(--gold); }

		.plate {
			min-height: 100vh;
			min-height: 100dvh;
			display: grid;
			place-items: center;
			position: relative;
			overflow: hidden;
			background: var(--navy);
		}
		.plate::before {
			content: "";
			position: absolute;
			inset: 0;
			background: radial-gradient(ellipse 70% 55% at 50% 48%, rgba(201,162,39,0.07), transparent 65%);
			pointer-events: none;
		}

		.mark {
			position: relative;
			font-size: clamp(150px, 44vw, 440px);
			line-height: 0.78;
			letter-spacing: -0.1em;
			color: var(--gold);
			user-select: none;
		}

		#ultra-bold .mark {
			font-family: "Skoljka Logo UltraBold", sans-serif;
			font-weight: 900;
			letter-spacing: -0.12em;
		}
		#humanist .mark {
			font-family: "Skoljka Logo Humanist", sans-serif;
			font-weight: 800;
			letter-spacing: -0.1em;
		}
		#ultra-contrast .mark {
			font-family: "Skoljka Logo UltraContrast", serif;
			font-weight: 800;
			color: var(--gold-soft);
		}
		#fell-contrast .mark {
			font-family: "Skoljka Logo FellContrast", serif;
			font-weight: 800;
		}
		#elegant .mark {
			font-family: "Skoljka Logo Elegant", serif;
			font-weight: 400;
			letter-spacing: -0.06em;
			font-size: clamp(140px, 40vw, 400px);
		}

		.rail {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			z-index: 5;
			display: flex;
			gap: 14px;
			justify-content: center;
			flex-wrap: wrap;
			padding: 12px 14px;
			font: 10px/1.2 ui-monospace, monospace;
			letter-spacing: 0.14em;
			text-transform: uppercase;
			background: rgba(6,14,26,0.92);
			border-bottom: 1px solid rgba(201,162,39,0.18);
		}
		.rail a { color: #8a7a4a; text-decoration: none; }
		.rail a:hover { color: var(--gold); }
		body.capture .rail { display: none; }
	</style>
</head>
<body>
	<nav class="rail" aria-label="Cuts">
		<a href="#ultra-bold">Ultra Bold · Grotesk</a>
		<a href="#humanist">Humanist · Antique</a>
		<a href="#ultra-contrast">Ultra Contrast · Spectral</a>
		<a href="#fell-contrast">Fell Contrast</a>
		<a href="#elegant">Elegant · Elzevir</a>
	</nav>

	<section class="plate" id="ultra-bold" data-cut="ultra-bold">
		<div class="mark" aria-label="Logo 54">54</div>
	</section>
	<section class="plate" id="humanist" data-cut="humanist">
		<div class="mark" aria-label="Logo 54">54</div>
	</section>
	<section class="plate" id="ultra-contrast" data-cut="ultra-contrast">
		<div class="mark" aria-label="Logo 54">54</div>
	</section>
	<section class="plate" id="fell-contrast" data-cut="fell-contrast">
		<div class="mark" aria-label="Logo 54">54</div>
	</section>
	<section class="plate" id="elegant" data-cut="elegant">
		<div class="mark" aria-label="Logo 54">54</div>
	</section>
</body>
</html>
