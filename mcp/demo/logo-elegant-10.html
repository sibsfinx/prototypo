<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Elegant — 10 variations — 54</title>
	<style>
		@font-face { font-family: "E01"; src: url("./fonts/SkoljkaLogo-E01-UltraBold.otf") format("opentype"); font-display: block; }
		@font-face { font-family: "E02"; src: url("./fonts/SkoljkaLogo-E02-Black.otf") format("opentype"); font-display: block; }
		@font-face { font-family: "E03"; src: url("./fonts/SkoljkaLogo-E03-Tall.otf") format("opentype"); font-display: block; }
		@font-face { font-family: "E04"; src: url("./fonts/SkoljkaLogo-E04-Contrast.otf") format("opentype"); font-display: block; }
		@font-face { font-family: "E05"; src: url("./fonts/SkoljkaLogo-E05-UltraBoldBlack.otf") format("opentype"); font-display: block; }
		@font-face { font-family: "E06"; src: url("./fonts/SkoljkaLogo-E06-UltraBoldTall.otf") format("opentype"); font-display: block; }
		@font-face { font-family: "E07"; src: url("./fonts/SkoljkaLogo-E07-UltraBoldContrast.otf") format("opentype"); font-display: block; }
		@font-face { font-family: "E08"; src: url("./fonts/SkoljkaLogo-E08-BlackTall.otf") format("opentype"); font-display: block; }
		@font-face { font-family: "E09"; src: url("./fonts/SkoljkaLogo-E09-TallContrast.otf") format("opentype"); font-display: block; }
		@font-face { font-family: "E10"; src: url("./fonts/SkoljkaLogo-E10-All.otf") format("opentype"); font-display: block; }

		* { box-sizing: border-box; margin: 0; }
		html, body { background: #f3efe6; color: #111; }

		.plate {
			min-height: 100vh;
			min-height: 100dvh;
			display: grid;
			place-items: center;
			background: #f3efe6;
			position: relative;
		}
		.mark {
			font-size: clamp(140px, 36vw, 380px);
			line-height: 0.82;
			letter-spacing: -0.03em;
			color: #111;
			user-select: none;
		}
		.plate.tall .mark { font-size: clamp(150px, 40vw, 440px); line-height: 0.78; }

		#e01 .mark { font-family: "E01", serif; }
		#e02 .mark { font-family: "E02", serif; }
		#e03 .mark { font-family: "E03", serif; }
		#e04 .mark { font-family: "E04", serif; }
		#e05 .mark { font-family: "E05", serif; }
		#e06 .mark { font-family: "E06", serif; }
		#e07 .mark { font-family: "E07", serif; }
		#e08 .mark { font-family: "E08", serif; }
		#e09 .mark { font-family: "E09", serif; }
		#e10 .mark { font-family: "E10", serif; }
	</style>
</head>
<body>
	<section class="plate" id="e01"><div class="mark">54</div></section>
	<section class="plate" id="e02"><div class="mark">54</div></section>
	<section class="plate tall" id="e03"><div class="mark">54</div></section>
	<section class="plate" id="e04"><div class="mark">54</div></section>
	<section class="plate" id="e05"><div class="mark">54</div></section>
	<section class="plate tall" id="e06"><div class="mark">54</div></section>
	<section class="plate" id="e07"><div class="mark">54</div></section>
	<section class="plate tall" id="e08"><div class="mark">54</div></section>
	<section class="plate tall" id="e09"><div class="mark">54</div></section>
	<section class="plate tall" id="e10"><div class="mark">54</div></section>
</body>
</html>
